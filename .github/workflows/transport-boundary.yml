name: Living Web Server Fetch/Node source boundary
on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - test/**
      - .github/workflows/transport-boundary.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - src/**
      - test/**
      - .github/workflows/transport-boundary.yml
permissions:
  contents: read
concurrency:
  group: living-web-transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      minimum-node: ${{ steps.contract.outputs.minimum-node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check source syntax and receiving package enrollment
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          for module in src/*.mjs; do node --check "$module"; done
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          npm pack --ignore-scripts --json --pack-destination "$scratch" > "$scratch/pack.json"
          node --input-type=module - "$scratch/pack.json" <<'NODE'
          import assert from "node:assert/strict";
          import {appendFileSync,readFileSync} from "node:fs";
          import {fileURLToPath} from "node:url";
          import {relative} from "node:path";
          const read = path => JSON.parse(readFileSync(path,"utf8"));
          const manifest = read("package.json");
          const minimum = /^>=(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.exec(manifest.engines?.node ?? "");
          assert.ok(minimum,"Declare one exact minimum Node version with >=MAJOR.MINOR.PATCH");
          const nodeTransport = "@red-cup-engineering/computer-web-server";
          assert.equal(manifest.dependencies?.[nodeTransport],undefined);
          assert.ok(manifest.peerDependencies?.[nodeTransport]);
          assert.equal(manifest.peerDependenciesMeta?.[nodeTransport]?.optional,true);
          const [pack] = read(process.argv[2]);
          assert.equal(pack.name,manifest.name);
          const members = new Set(pack.files.map(file => file.path));
          const declared = manifest.receivingTests;
          assert.ok(Array.isArray(declared) && declared.length > 0);
          for (const path of declared) assert.ok(members.has(path), `Missing packed receiver: ${path}`);
          assert.ok(manifest.exports?.["."], "Declare the package root export");
          for (const key of Object.keys(manifest.exports)) {
            assert.ok(key === "." || (key.startsWith("./") && !key.includes("*")), `Expected an explicit public export: ${key}`);
            const specifier = key === "." ? manifest.name : manifest.name + key.slice(1);
            const selected = relative(process.cwd(),fileURLToPath(import.meta.resolve(specifier)));
            assert.ok(members.has(selected), `Missing packed export: ${specifier}`);
          }
          assert.ok(process.env.GITHUB_OUTPUT,"Minimum runtime needs the workflow output file");
          appendFileSync(process.env.GITHUB_OUTPUT,`minimum-node=${minimum.slice(1).join(".")}\n`);
          NODE
  installed-suite:
    env:
      npm_config_registry: https://registry.561.group/
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ needs.source-contract.outputs.minimum-node }}
      - name: Require the canonical frozen registry input
        shell: bash
        run: |
          if ! test -s package-lock.json; then
            echo "::error file=package.json::Missing canonical npm lock. Receive exact issued packages through the configured scoped registry before installed qualification."
            exit 1
          fi
      - name: Install the frozen TUFTE, Markdown and transport graph
        run: npm ci --include=dev --engine-strict --strict-peer-deps --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - name: Verify original Markdown receiving on the installed graph
        run: npm test
